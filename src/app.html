<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- Шрифты со своего хоста, объявлены в src/fonts.css. Предзагружаем
		     кириллические подмножества: страница по умолчанию рендерится
		     по-русски, и без этого первый кадр успевает мигнуть подстановкой. -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="%sveltekit.assets%/fonts/golos-text-cyrillic.woff2"
			crossorigin
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="%sveltekit.assets%/fonts/unbounded-cyrillic.woff2"
			crossorigin
		/>
		<!-- Заголовок ставит каждая страница сама через svelte:head.
		     Запасной тут был бы первым в разметке — поисковик взял бы именно его. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
